services:
  - type: web
    name: alturia-api
    runtime: node
    plan: free
    rootDir: apps/api
    # Install runs from the monorepo root so pnpm workspace linking (@alturia/shared)
    # resolves correctly — its postinstall hook already builds packages/shared,
    # so this only needs to build the api itself on top of that.
    #
    # Then it brings Neon up to date with the code being deployed, so a schema
    # change can't ship without its migration (that's how the publicToken column
    # went missing). `migrate deploy` only applies pending migration files — no
    # diffing, so it never touches the hand-added pgvector index (see
    # apps/api/prisma/README.md). The seed is idempotent (upserts on fixed ids),
    # so re-running it every deploy only fills in new demo data. Both read
    # DATABASE_URL / SEED_ADMIN_PASSWORD from this service's env vars. Render's
    # preDeployCommand would be the cleaner hook, but it isn't available on the
    # free instance type, so this runs at the end of the build instead.
    buildCommand: >-
      cd ../.. && pnpm install && pnpm --filter api run build
      && pnpm --filter api exec prisma migrate deploy
      && pnpm --filter api run seed
    startCommand: node dist/src/main.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # set to the Neon connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LLM_CHAT_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      # ":free" models run on OpenRouter's shared pool: they get retired
      # (qwen3.6-plus, nemotron-3-nano) or rate-limited upstream (HTTP 429)
      # without notice. The production model is the regular variant, served
      # through our own Google AI Studio key registered in OpenRouter (BYOK,
      # Prioritized), so requests use that key's quota instead of the pool.
      - key: OPENROUTER_CHAT_MODEL
        value: google/gemma-4-31b-it
      # EMBEDDING_PROVIDER is optional (defaults to ollama) because nothing
      # calls .embed() yet — KnowledgeModule does plain context stuffing.
      # Set it, plus OPENAI_API_KEY, once real retrieval lands.
      - key: SEED_ADMIN_PASSWORD
        sync: false
