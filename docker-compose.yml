services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alturia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alturia
      POSTGRES_PASSWORD: alturia
      POSTGRES_DB: alturia
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    # Lets `docker compose up --wait` (pnpm db:up) return only once Postgres
    # accepts connections, so migrations never race the database start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alturia -d alturia"]
      interval: 2s
      timeout: 3s
      retries: 30
