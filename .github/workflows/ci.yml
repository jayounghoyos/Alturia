name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Format and shared package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck shared
        run: pnpm --filter shared run typecheck

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: alturia
          POSTGRES_PASSWORD: alturia
          POSTGRES_DB: alturia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://alturia:alturia@localhost:5432/alturia
      # Reuse the service above for e2e instead of starting a Testcontainers
      # Postgres (apps/api/test/global-setup.ts does that only when this is unset).
      E2E_DATABASE_URL: postgresql://alturia:alturia@localhost:5432/alturia
      JWT_SECRET: ci-test-secret
      LLM_CHAT_PROVIDER: ollama
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm --filter api run lint

      - name: Typecheck
        run: pnpm --filter api run typecheck

      - name: Build
        run: pnpm --filter api run build

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy

      - name: Unit tests
        run: pnpm --filter api run test

      - name: E2E tests
        run: pnpm --filter api run test:e2e

  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, widget]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm --filter ${{ matrix.app }} run lint

      - name: Typecheck
        run: pnpm --filter ${{ matrix.app }} run typecheck

      - name: Tests
        run: pnpm --filter ${{ matrix.app }} run test

      - name: Build
        run: pnpm --filter ${{ matrix.app }} run build
